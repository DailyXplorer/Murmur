name: "Playwright"
# The UI suite, in four shards of four workers each. A pull request runs it
# only when a frontend file changes (`changes`); a push to main and a manual
# run always do. `playwright-ok` says whether it passed.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether the change needs the suite
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # tests/windowSizes.ts reads the window sizes from app_windows.rs.
          # `bun run check:playwright-paths` fails when a test reads a file
          # outside src/ and tests/ that this filter lacks.
          ./.github/scripts/changed-paths.sh \
            'frontend=src/.*|tests/.*|src-tauri/src/app_windows\.rs|package\.json|bun\.lock|playwright\.config\..*|vite\.config\.ts|tsconfig.*|tailwind\.config\..*|postcss\.config\..*|index\.html|\.github/workflows/playwright\.yml|\.github/scripts/changed-paths\..*'

  playwright:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      # Every Mac has a Devanagari font; without one, Hindi and Nepali render
      # as boxes twice as wide and the layout checks measure those.
      - name: Install a Devanagari font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-lohit-deva

      - name: Run Playwright tests (shard ${{ matrix.shard }} of 4)
        run: bun run test:playwright --shard=${{ matrix.shard }}/4

      - name: Upload the shard's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          # A shard that died before Playwright wrote a report has no blob.
          if-no-files-found: ignore

  # One HTML report from the shards' blobs, only when a shard failed.
  report:
    needs: playwright
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tolerates a missing blob: a shard that was cancelled or died early
      # uploads none, and the others' reports are still worth merging.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge the shards' reports
        run: |
          if compgen -G "all-blob-reports/*.zip" >/dev/null; then
            bunx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "no shard left a report: nothing to merge"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one check that tells whether the suite passed: skipped (no frontend
  # change) counts as passing; a failed or cancelled shard does not.
  playwright-ok:
    if: always()
    needs: [changes, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "a job failed or was cancelled" >&2
            exit 1
          fi
