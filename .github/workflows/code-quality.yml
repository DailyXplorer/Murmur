name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "eslint-rules/**"
      - "index.html"
      - "src/overlay/index.html"
      - "vite.config.ts"
      - "playwright.config.*"
      - "tests/**"
      - ".githooks/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "eslint-rules/**"
      - "index.html"
      - "src/overlay/index.html"
      - "vite.config.ts"
      - "playwright.config.*"
      - "tests/**"
      - ".githooks/**"
      - ".github/scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: bun audit

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check macOS-only invariants
        run: bun run check:macos-only

      - name: Test updater manifest
        run: bun run test:updater-manifest

      - name: Check release versions
        run: bun run test:versions && bun run check:versions

      - name: Run ESLint
        run: bun run lint

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Run prettier
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Typecheck tests
        run: bun run check:types
