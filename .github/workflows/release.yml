name: "Release"

on: workflow_dispatch

jobs:
  validate-release-source:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable main source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  create-release:
    needs: validate-release-source
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-release-source.outputs.sha }}
          persist-credentials: false

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: '${{ needs.validate-release-source.outputs.sha }}',
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: [validate-release-source, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based Macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "murmur"
      release-id: ${{ needs.create-release.outputs.release-id }}
      ref: ${{ needs.validate-release-source.outputs.sha }}
      environment: "release-signing"
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish-release:
    permissions:
      contents: write
    needs: [validate-release-source, create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate-release-source.outputs.sha }}
          persist-credentials: false

      - name: Build and upload updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node .github/scripts/publish-updater-manifest.mjs

      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.create-release.outputs.release-id }}'),
              draft: false,
              prerelease: false,
              make_latest: 'true'
            })

      - name: Verify public updater manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5; do
            if manifest="$(curl --fail --silent --show-error --location "$url")" &&
              VERSION="$VERSION" MANIFEST="$manifest" node .github/scripts/publish-updater-manifest.mjs --verify-public; then
              exit 0
            fi
            sleep 5
          done
          echo "Updater manifest did not become publicly available" >&2
          exit 1
