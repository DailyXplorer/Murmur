name: "Main Branch Build"

# An unsigned macOS (darwin) release-profile build of main, so a build breakage
# is caught before a manual release is triggered. It runs every night (03:47
# UTC, on the latest commit of main) and by hand (Actions, Main Branch Build,
# Run workflow), no longer on every push: two release-profile builds took 18
# minutes and two of the five macOS runners on every merge, next to `test`.
# The tests (`test`, `windows`) still run on the pushes their paths match. Artifacts are kept
# for 30 days, so the last night's commit has a downloadable, testable build.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"

# Nothing queued behind a running build is dropped for a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: false
      asset-prefix: "murmur-main-unsigned-not-notarized"
      ref: ${{ github.sha }}
