name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "murmur"
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      no-cache:
        required: false
        type: boolean
        default: false
      environment:
        required: false
        type: string
        default: "unsigned-build"
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      APPLE_PASSWORD:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # Stable self-signed certificate (scripts/create-signing-cert.sh). Used
      # when no Developer ID certificate is configured, so macOS keeps
      # Accessibility and microphone grants across updates.
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false

jobs:
  build:
    # Inherit the caller's token permissions: ordinary builds use contents: read,
    # while release.yml grants contents: write to upload release assets.
    runs-on: ${{ inputs.platform }}
    environment: ${{ inputs.environment }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARIZATION: ${{ inputs.sign-binaries && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && (secrets.APPLE_ID_PASSWORD != '' || secrets.APPLE_PASSWORD != '') }}
      HAS_STABLE_CERTIFICATE: ${{ inputs.sign-binaries && secrets.APPLE_CERTIFICATE == '' && secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.build-args }}" == *"--debug"* ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          targets: ${{ inputs.target }}

      - name: Rust cache
        # Release builds skip the cache (no-cache: true) so the artifact is
        # always compiled clean — no risk of a stale cached native lib being
        # linked. PR/test builds keep caching for speed.
        if: ${{ !inputs.no-cache }}
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}

      - name: Cache the meetings helper build
        if: ${{ !inputs.no-cache && inputs.target == 'aarch64-apple-darwin' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/swift/MurmurMeetingsHelper/.build
          key: meetings-helper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/swift/MurmurMeetingsHelper/Package.resolved') }}

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: import Apple Developer Certificate
        if: inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: verify certificate
        if: inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Import stable signing certificate
        if: env.HAS_STABLE_CERTIFICATE == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/murmur-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/murmur-signing.p12"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"

          # codesign looks identities up through the user search list.
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

          # A self-signed certificate is not trusted, so `find-identity -v`
          # hides it; codesign still signs with it. Check it is present.
          if ! security find-identity -p codesigning "$keychain" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "Signing identity not found in the imported certificate" >&2
            exit 1
          fi
          echo "STABLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "STABLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build test bundles without updater signatures
        if: ${{ !inputs.sign-binaries }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          includeUpdaterJson: false
          args: >-
            ${{ inputs.build-args }}
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build with Tauri
        if: inputs.sign-binaries && (env.HAS_APPLE_CERTIFICATE != 'true' || env.HAS_APPLE_NOTARIZATION != 'true')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The certificate import steps above own the keychain. Passing an
          # empty APPLE_CERTIFICATE here makes Tauri try (and fail) to import
          # it again. Without any certificate the build falls back to ad hoc.
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_APPLE_CERTIFICATE == 'true' && env.CERT_ID || env.HAS_STABLE_CERTIFICATE == 'true' && env.STABLE_SIGNING_IDENTITY || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          includeUpdaterJson: false
          args: ${{ inputs.build-args }}

      - name: Build and notarize with Tauri
        if: inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_APPLE_NOTARIZATION == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          includeUpdaterJson: false
          args: ${{ inputs.build-args }}

      - name: Verify macOS dylib bundling
        if: inputs.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          APP=$(find src-tauri/target -name "*.app" -type d | head -1)
          echo "=== Checking all @rpath deps are satisfied ==="
          RPATH_DEPS=$(otool -L "$APP/Contents/MacOS/murmur" | awk '$1 ~ /^@rpath\// {print $1}')
          if [ -z "$RPATH_DEPS" ]; then
            echo "No @rpath dependencies to verify."
            exit 0
          fi
          while read -r dep; do
            libname=$(basename "$dep")
            if [ ! -f "$APP/Contents/Frameworks/$libname" ]; then
              echo "MISSING: $libname not found in Frameworks/"
              exit 1
            else
              echo "OK: $libname"
            fi
          done <<< "$RPATH_DEPS"

      - name: Remove stable signing keychain
        if: always() && env.STABLE_SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$STABLE_SIGNING_KEYCHAIN" || true

      - name: Upload artifacts (macOS)
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
          retention-days: 30
