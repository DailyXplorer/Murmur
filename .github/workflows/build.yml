name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "murmur"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      require-stable-macos-identity:
        description: "Fail instead of using ad-hoc signing for a distributed macOS build"
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false
      no-cache:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_APPLE_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && (secrets.APPLE_ID_PASSWORD != '' || secrets.APPLE_PASSWORD != '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Require stable macOS distribution identity
        if: contains(inputs.platform, 'macos') && inputs.require-stable-macos-identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.sign-binaries }}" != "true" ]]; then
            echo "::error::require-stable-macos-identity requires sign-binaries=true."
            exit 1
          fi

          if [[ "$HAS_APPLE_CERTIFICATE" != "true" ]]; then
            echo "::error::A distributed macOS build requires APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and KEYCHAIN_PASSWORD. Ad-hoc signing changes the app identity on every update."
            exit 1
          fi

          if [[ "$HAS_APPLE_NOTARIZATION" != "true" ]]; then
            echo "::error::A distributed macOS build requires APPLE_ID, APPLE_TEAM_ID, and either APPLE_ID_PASSWORD or APPLE_PASSWORD for notarization."
            exit 1
          fi

          echo "Stable Developer ID signing and notarization are configured."

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Apple rustc targets are only installed on macos-* runners.
          # Never add aarch64-apple-darwin / x86_64-apple-darwin on ubuntu.
          targets: ${{ contains(inputs.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        # Release builds skip the cache (no-cache: true) so the artifact is
        # always compiled clean — no risk of a stale cached native lib being
        # linked. PR/test builds keep caching for speed.
        if: ${{ !inputs.no-cache }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}

      - name: install frontend dependencies
        run: bun install

      - name: rustup install target
        if: ${{ inputs.target != '' && contains(inputs.target, 'apple-darwin') }}
        run: rustup target add ${{ inputs.target }}

      - name: import Apple Developer Certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: verify certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [[ -z "$CERT_ID" ]]; then
            echo "::error::APPLE_CERTIFICATE does not contain a valid Developer ID Application identity."
            exit 1
          fi
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          echo "Developer ID Application certificate imported."

      - name: Configure Apple notarization
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries && env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_APPLE_NOTARIZATION == 'true'
        env:
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD_SECRET: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID_PASSWORD_SECRET" ]; then
            echo "APPLE_ID_PASSWORD=$APPLE_ID_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_PASSWORD_SECRET" ]; then
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Patch asset name pattern
        id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' && inputs.asset-name-pattern != '' }}
        run: |
          platform="${{ inputs.platform }}"
          replacement="$(echo ${platform} | sed -E 's/-latest//')"
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The certificate import step above owns APPLE_CERTIFICATE. Passing an
          # empty value here makes Tauri try (and fail) to import it again.
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_APPLE_CERTIFICATE == 'true' && env.CERT_ID || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          assetNamePattern: ${{ steps.patch-release-name.outputs.platform }}
          includeUpdaterJson: false
          args: ${{ inputs.build-args }}

      - name: Verify stable macOS app identity
        if: contains(inputs.platform, 'macos') && inputs.require-stable-macos-identity
        shell: bash
        run: |
          set -euo pipefail

          APP="src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/Murmur.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::Expected macOS app bundle not found at $APP."
            exit 1
          fi

          SIGNATURE_INFO=$(codesign -dv --verbose=4 "$APP" 2>&1)
          DESIGNATED_REQUIREMENT=$(codesign -d -r- "$APP" 2>&1)

          if grep -q '^Signature=adhoc$' <<< "$SIGNATURE_INFO"; then
            echo "::error::Murmur.app is ad-hoc signed. This would invalidate its macOS permission grants on update."
            exit 1
          fi

          TEAM_ID=$(awk -F= '/^TeamIdentifier=/{print $2; exit}' <<< "$SIGNATURE_INFO")
          if [[ -z "$TEAM_ID" || "$TEAM_ID" == "not set" ]]; then
            echo "::error::Murmur.app has no stable Apple TeamIdentifier."
            exit 1
          fi

          if ! grep -q '^Authority=Developer ID Application:' <<< "$SIGNATURE_INFO"; then
            echo "::error::Murmur.app is not signed with a Developer ID Application certificate."
            exit 1
          fi

          if grep -q 'designated => cdhash' <<< "$DESIGNATED_REQUIREMENT"; then
            echo "::error::Murmur.app uses a build-specific cdhash designated requirement."
            exit 1
          fi

          if ! grep -q 'identifier "com.dailyxplorer.murmur"' <<< "$DESIGNATED_REQUIREMENT"; then
            echo "::error::Murmur.app designated requirement does not contain the production bundle identifier."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Verified stable macOS code identity for team $TEAM_ID."

      - name: Verify macOS dylib bundling
        if: inputs.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          APP=$(find src-tauri/target -name "*.app" -type d | head -1)
          echo "=== Checking all @rpath deps are satisfied ==="
          RPATH_DEPS=$(otool -L "$APP/Contents/MacOS/murmur" | awk '$1 ~ /^@rpath\// {print $1}')
          if [ -z "$RPATH_DEPS" ]; then
            echo "No @rpath dependencies to verify."
            exit 0
          fi
          while read -r dep; do
            libname=$(basename "$dep")
            if [ ! -f "$APP/Contents/Frameworks/$libname" ]; then
              echo "MISSING: $libname not found in Frameworks/"
              exit 1
            else
              echo "OK: $libname"
            fi
          done <<< "$RPATH_DEPS"

      - name: Upload artifacts (macOS)
        if: inputs.upload-artifacts && contains(inputs.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
          retention-days: 30
