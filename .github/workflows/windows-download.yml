name: windows installer

# Copies the newest versioned Windows installer onto the pre-release tag
# `windows-installer` as `Murmur_x64-setup.exe`. The README links there, so a
# Windows beta does not leave a version number to edit by hand.
# The pre-release is never marked latest, so macOS updates keep using
# latest.json on the newest full release. See issue #157.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'release' || github.event.release.tag_name != 'windows-installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Refresh the stable Windows installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/windows-download.mjs --sync
