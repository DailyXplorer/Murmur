name: windows
# Windows is a beta: this builds, tests, installs and launches the Windows app
# on every pull request and every push to main. It holds no release secret and
# publishes nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check platform invariants
        run: bun run check:platforms

      - name: Test the Windows update feed
        run: bun run test:windows-updater

      - name: Run ESLint
        run: bun run lint

      # On Ubuntu: a Windows checkout turns line endings into CRLF.
      - name: Check formatting
        run: bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:playwright

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # bindings.ts and other checked-in files are compared byte for byte.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest

      - name: Prove a hung test times out
        shell: pwsh
        run: ./.github/scripts/check-nextest-timeout.ps1

      # The meeting audio archive tests encode AAC; Server images lack it.
      - name: Install the AAC encoder
        shell: pwsh
        run: ./.github/scripts/windows-media-foundation.ps1

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo nextest run --locked --profile ci

      - name: Run Rust doctests
        working-directory: src-tauri
        run: cargo test --locked --doc

      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-rust-tests
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # The real GGUF model, loaded and mapped by transcribe.cpp: hears spoken
  # clips, and deleting the models releases it. A job of its own, so a cache
  # miss (739 MB) costs only this job.
  cpu-model:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: cpu-model

      - name: Cache the model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: windows-parakeet-gguf-${{ hashFiles('src-tauri/src/local_models/pinned.rs') }}

      - name: Download the model
        working-directory: src-tauri
        run: cargo run --locked --example fetch_models -- "${{ runner.temp }}/models"

      # Windows' own voices, 16 kHz mono as the app records. French only
      # where the runner has a French voice. ASCII text: Windows PowerShell
      # reads the script as ANSI.
      - name: Record the clips
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $clips = Join-Path $env:RUNNER_TEMP "clips"
          New-Item -ItemType Directory -Force $clips | Out-Null
          $voices = (New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | Where-Object Enabled
          $voices | ForEach-Object { Write-Output "voice: $($_.VoiceInfo.Name) ($($_.VoiceInfo.Culture))" }
          $texts = @(
            @{ Name = "en"; Culture = "en-US"; Text = "The quick brown fox jumps over the lazy dog near the river bank."; Words = "quick`nbrown`nfox`nriver`n" },
            @{ Name = "fr"; Culture = "fr-FR"; Text = "Bonjour, je voudrais une table pour quatre personnes jeudi soir."; Words = "table`nquatre`njeudi`n" }
          )
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $recorded = 0
          foreach ($clip in $texts) {
            $voice = $voices | Where-Object { $_.VoiceInfo.Culture.Name -eq $clip.Culture } | Select-Object -First 1
            if (-not $voice) { Write-Output "no $($clip.Culture) voice: no $($clip.Name) clip"; continue }
            $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $synth.SelectVoice($voice.VoiceInfo.Name)
            $synth.SetOutputToWaveFile((Join-Path $clips "$($clip.Name).wav"), $format)
            $synth.Speak($clip.Text)
            $synth.Dispose()
            [System.IO.File]::WriteAllText((Join-Path $clips "$($clip.Name).txt"), $clip.Words)
            $recorded++
          }
          if ($recorded -eq 0) { throw "no voice to record a clip with" }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest

      # Exact filters, and the count checked, so a renamed test fails the job
      # instead of matching nothing. The replace-then-delete test is macOS
      # only: Windows may refuse both while the file is mapped.
      - name: Transcribe the clips and delete the loaded model
        working-directory: src-tauri
        shell: bash
        env:
          MURMUR_SMOKE_MODELS: ${{ runner.temp }}/models
          MURMUR_SMOKE_CLIPS: ${{ runner.temp }}/clips
        run: |
          set -euo pipefail
          cargo nextest run --locked --lib --profile ci --color never \
            --run-ignored only --no-capture \
            -E 'test(=engine::local::cpu::tests::the_cpu_model_hears_the_words_of_each_clip) | test(=engine::local::cpu::tests::deleting_the_models_releases_the_loaded_cpu_model)' \
            2>&1 | tee "$RUNNER_TEMP/cpu-model.txt"
          grep -q "2 tests run: 2 passed" "$RUNNER_TEMP/cpu-model.txt"

      # Two of Windows' own voices speak three utterances in turn, 16 kHz
      # mono as the app records. A voice of each gender when the runner has
      # both; with one voice the speakers are not checked. ASCII text:
      # Windows PowerShell reads the script as ANSI.
      - name: Record the dialogue
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $dialogue = Join-Path $env:RUNNER_TEMP "dialogue"
          New-Item -ItemType Directory -Force $dialogue | Out-Null
          $voices = @((New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | Where-Object { $_.Enabled -and $_.VoiceInfo.Culture.Name -eq "en-US" })
          $voices | ForEach-Object { Write-Output "voice: $($_.VoiceInfo.Name) ($($_.VoiceInfo.Gender))" }
          if ($voices.Count -eq 0) { throw "no en-US voice to record the dialogue with" }
          $first = $voices[0]
          $second = $voices | Where-Object { $_.VoiceInfo.Gender -ne $first.VoiceInfo.Gender } | Select-Object -First 1
          if (-not $second) { $second = $voices | Where-Object { $_.VoiceInfo.Name -ne $first.VoiceInfo.Name } | Select-Object -First 1 }
          if (-not $second) {
            $second = $first
            New-Item -ItemType File -Force (Join-Path $dialogue "one-voice") | Out-Null
          }
          $utterances = @(
            @{ Voice = $first; Text = "Good morning everyone, thank you for joining the planning meeting today."; Words = "morning`neveryone`nthank`njoining`nplanning`nmeeting`ntoday`n" },
            @{ Voice = $second; Text = "Thanks, I reviewed the budget yesterday and the numbers look quite reasonable."; Words = "thanks`nreviewed`nbudget`nyesterday`nnumbers`nlook`nquite`nreasonable`n" },
            @{ Voice = $first; Text = "Great, then let us schedule the next review for Thursday afternoon."; Words = "great`nschedule`nnext`nreview`nthursday`nafternoon`n" }
          )
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $number = 0
          foreach ($utterance in $utterances) {
            $number++
            $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $synth.SelectVoice($utterance.Voice.VoiceInfo.Name)
            $synth.SetOutputToWaveFile((Join-Path $dialogue "u$number.wav"), $format)
            $synth.Speak($utterance.Text)
            $synth.Dispose()
            [System.IO.File]::WriteAllText((Join-Path $dialogue "u$number.txt"), $utterance.Words)
          }

      # The same dialogue in French, with two French voices when the runner
      # has them (a Server image usually has none: then the step says so and
      # the French test skips itself). With one voice the speakers are not
      # checked. ASCII text: Windows PowerShell reads the script as ANSI.
      - name: Record the French dialogue
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $dialogue = Join-Path $env:RUNNER_TEMP "dialogue-fr"
          New-Item -ItemType Directory -Force $dialogue | Out-Null
          $voices = @((New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | Where-Object { $_.Enabled -and $_.VoiceInfo.Culture.Name -eq "fr-FR" })
          $voices | ForEach-Object { Write-Output "voice: $($_.VoiceInfo.Name) ($($_.VoiceInfo.Gender))" }
          if ($voices.Count -eq 0) {
            Write-Output "no fr-FR voice on this runner: the French dialogue is skipped"
            exit 0
          }
          $first = $voices[0]
          $second = $voices | Where-Object { $_.VoiceInfo.Gender -ne $first.VoiceInfo.Gender } | Select-Object -First 1
          if (-not $second) { $second = $voices | Where-Object { $_.VoiceInfo.Name -ne $first.VoiceInfo.Name } | Select-Object -First 1 }
          if (-not $second) {
            $second = $first
            New-Item -ItemType File -Force (Join-Path $dialogue "one-voice") | Out-Null
          }
          $utterances = @(
            @{ Voice = $first; Text = "Bonjour a tous, merci de participer a la reunion de planification aujourd'hui."; Words = "bonjour`nmerci`nparticiper`nreunion`nplanification`n" },
            @{ Voice = $second; Text = "Merci, j'ai relu le budget hier et les chiffres me semblent tout a fait raisonnables."; Words = "merci`nrelu`nbudget`nhier`nchiffres`nsemblent`nraisonnables`n" },
            @{ Voice = $first; Text = "Parfait, alors fixons la prochaine revue a jeudi apres-midi."; Words = "parfait`nfixons`nprochaine`nrevue`njeudi`n" }
          )
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $number = 0
          foreach ($utterance in $utterances) {
            $number++
            $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $synth.SelectVoice($utterance.Voice.VoiceInfo.Name)
            $synth.SetOutputToWaveFile((Join-Path $dialogue "u$number.wav"), $format)
            $synth.Speak($utterance.Text)
            $synth.Dispose()
            [System.IO.File]::WriteAllText((Join-Path $dialogue "u$number.txt"), $utterance.Words)
          }

      # The analysis the app runs after a meeting, on those dialogues: word
      # times in order and inside the clip, most words timed, two speakers
      # with the change near the splice, told apart by pyannote Community-1
      # through ONNX Runtime. The French test skips itself when the runner
      # has no French voice. The folder test opens a folder with no model,
      # which needs the CPU modules.
      - name: Time the words and tell the voices apart
        working-directory: src-tauri
        shell: bash
        env:
          MURMUR_SMOKE_MODELS: ${{ runner.temp }}/models
          MURMUR_SMOKE_DIALOGUE: ${{ runner.temp }}/dialogue
          MURMUR_SMOKE_DIALOGUE_FR: ${{ runner.temp }}/dialogue-fr
        run: |
          set -euo pipefail
          cargo nextest run --locked --lib --profile ci --color never \
            --run-ignored only --no-capture \
            -E 'test(=meetings::analysis_cpp::tests::two_voices_are_timed_and_told_apart) | test(=meetings::analysis_cpp::tests::two_french_voices_are_timed_and_told_apart) | test(=meetings::analysis_cpp::tests::a_folder_without_the_speech_model_ends_the_analysis_without_a_panic)' \
            2>&1 | tee "$RUNNER_TEMP/analysis.txt"
          grep -q "3 tests run: 3 passed" "$RUNNER_TEMP/analysis.txt"

  # Meeting system audio against a real sound output: a tone is played and
  # the WASAPI loopback must hear it, and the process loopback must not hear
  # the test process's own tone. A hosted runner usually has no audio device
  # and installs none here, so the tests skip with a logged reason and the
  # job ends with a warning: not proven in CI. It cannot fail a push until it
  # has been green on a runner that has an output.
  meetings-audio:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: meetings-audio

      # Windows Audio is off on a hosted runner. Turning it on gives an
      # output only when the image has an audio device.
      - name: Start the Windows Audio service
        shell: powershell
        run: |
          foreach ($name in "AudioEndpointBuilder", "Audiosrv") {
            try {
              Set-Service -Name $name -StartupType Automatic
              Start-Service -Name $name
            } catch {
              Write-Output "$name did not start: $($_.Exception.Message)"
            }
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name, Status
          $devices = @(Get-CimInstance Win32_SoundDevice)
          Write-Output "sound devices: $($devices.Count)"
          $devices | ForEach-Object { Write-Output "  $($_.Name)" }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest

      - name: Play a tone and record it back
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --locked --lib --profile ci --color never \
            --run-ignored only --no-capture \
            -E 'test(=meetings::capture::wasapi::tests::wasapi_loopback_hears_a_tone) | test(=meetings::capture::wasapi::tests::wasapi_process_loopback_leaves_out_the_own_process)' \
            2>&1 | tee "$RUNNER_TEMP/meetings-audio.txt"
          grep -q "2 tests run: 2 passed" "$RUNNER_TEMP/meetings-audio.txt"
          if grep -q "skipped:" "$RUNNER_TEMP/meetings-audio.txt"; then
            echo "::warning::not proven in CI: $(grep -h 'skipped:' "$RUNNER_TEMP/meetings-audio.txt" | sort -u | head -n 3 | tr '\n' ' ')"
          fi

  installer:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Murmur then starts on a PC without the Visual C++ Redistributable.
      - name: Locate the Visual C++ runtime
        shell: pwsh
        run: ./.github/scripts/windows-vc-runtime.ps1

      - name: Build the installer
        run: bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: murmur-windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  smoke:
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: murmur-windows-installer
          path: installer

      - name: Install, launch and screenshot Murmur
        shell: pwsh
        run: >
          ./.github/scripts/windows-smoke.ps1
          -Installer (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          -OutputDir "$env:RUNNER_TEMP/smoke"

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: murmur-windows-smoke
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: error
