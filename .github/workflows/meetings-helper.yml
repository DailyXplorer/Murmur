name: "meetings helper"
# End-to-end check of the on-device meeting analysis: downloads the models
# with Murmur's own downloader (about 505 MB, cached), loads them once, then
# analyses a synthetic two-voice dialogue. Not on the PR path, to avoid the
# download on every change.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the helper build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/swift/MurmurMeetingsHelper/.build
          key: meetings-helper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/swift/MurmurMeetingsHelper/Package.resolved') }}

      - name: Cache the models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/models
          key: meetings-models-${{ hashFiles('src-tauri/swift/MurmurMeetingsHelper/Package.resolved', 'src-tauri/src/local_models/pinned.rs') }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build the helper
        working-directory: src-tauri/swift/MurmurMeetingsHelper
        run: |
          swift build -c release --arch arm64
          echo "HELPER=$(swift build -c release --arch arm64 --show-bin-path)/murmur-meetings-helper" >> "$GITHUB_ENV"

      - name: Download the models
        working-directory: src-tauri
        run: cargo run --locked --example fetch_models -- "$RUNNER_TEMP/models"

      # The helper quits when its stdin closes, as when Murmur quits, so
      # stdin is held open.
      - name: Load the models once
        shell: bash
        run: |
          set -o pipefail
          "$HELPER" prepare --models-dir "$RUNNER_TEMP/models" < <(sleep 7200) | tail -n 3

      - name: Analyse a synthetic dialogue
        working-directory: src-tauri/swift/MurmurMeetingsHelper/smoke
        shell: bash
        run: |
          voices=$(say -v '?' | awk '/en_(US|GB)/ {print $1}' | grep -xE 'Samantha|Daniel|Karen|Moira|Fred|Albert|Ralph' | head -n 2)
          test "$(wc -l <<<"$voices")" -eq 2
          python3 make_dialogue.py "$RUNNER_TEMP/dialogue.wav" $voices
          for command in analyze diarize; do
            "$HELPER" "$command" --models-dir "$RUNNER_TEMP/models" \
              --system "$RUNNER_TEMP/dialogue.wav" < <(sleep 7200)
          done | grep -v '"type":"progress"' > "$RUNNER_TEMP/analysis.jsonl"
          python3 check_analysis.py "$RUNNER_TEMP/analysis.jsonl"

      # Dictation keeps the helper running and sends it one WAV per line.
      - name: Transcribe dictations with serve
        shell: bash
        run: |
          # `head` ends the pipeline before the helper does.
          set -eu +o pipefail
          french=$(say -v '?' | awk '/fr_FR/ {print $1}' | grep -xE 'Thomas|Amelie|Audrey|Aurelie' | head -n 1)
          english=$(say -v '?' | awk '/en_US/ {print $1}' | grep -xE 'Samantha|Alex|Fred|Ralph' | head -n 1)
          say -v "$french" -o "$RUNNER_TEMP/fr.aiff" "Bonjour, je voudrais réserver une table pour quatre personnes jeudi soir."
          say -v "$english" -o "$RUNNER_TEMP/en.aiff" "The quick brown fox jumps over the lazy dog near the river bank."
          for clip in fr en; do
            afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/$clip.aiff" "$RUNNER_TEMP/$clip.wav"
          done
          out=$({
            printf '{"type":"transcribe","id":1,"wav":"%s"}\n' "$RUNNER_TEMP/fr.wav"
            printf '{"type":"transcribe","id":2,"wav":"%s"}\n' "$RUNNER_TEMP/en.wav"
            sleep 60
          } | "$HELPER" serve --models-dir "$RUNNER_TEMP/models" | head -n 3)
          echo "$out"
          grep -q '"type":"ready"' <<<"$out"
          grep '"id":1' <<<"$out" | grep -q 'jeudi'
          grep '"id":2' <<<"$out" | grep -q 'quick brown fox'
