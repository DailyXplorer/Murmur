name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      # build.rs builds the meetings helper with SwiftPM (FluidAudio).
      - name: Cache the meetings helper build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/swift/MurmurMeetingsHelper/.build
          key: meetings-helper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/swift/MurmurMeetingsHelper/Package.resolved') }}

      - name: Check generated macOS icons
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons -- --check

      - name: Test macOS icon generator
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Without models, analysis and the first load must report them missing
      # and never download: Murmur downloads them itself. The helper quits
      # when its stdin closes, as when Murmur quits, so stdin is held open.
      - name: Check the meetings helper stays offline
        working-directory: src-tauri
        shell: bash
        run: |
          helper=binaries/murmur-meetings-helper-aarch64-apple-darwin
          out=$("$helper" analyze --models-dir "$RUNNER_TEMP/no-models" < <(sleep 3600))
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          grep -q '"type":"done"' <<<"$out"
          if out=$("$helper" prepare --models-dir "$RUNNER_TEMP/no-models" < <(sleep 3600)); then
            echo "prepare succeeded without models" >&2
            exit 1
          fi
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          if out=$("$helper" serve --models-dir "$RUNNER_TEMP/no-models" < <(sleep 3600)); then
            echo "serve started without models" >&2
            exit 1
          fi
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          test ! -e "$RUNNER_TEMP/no-models/parakeet-tdt-0.6b-v3"
          test ! -e "$RUNNER_TEMP/no-models/speaker-diarization"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail

          # RUSTSEC-2026-0235 affects rkyv 0.7, present only through
          # rust_decimal's inactive optional rkyv feature. ferrous-opencc uses
          # rkyv 0.8, which is patched from 0.8.17. Fail before ignoring it if
          # rkyv 0.7 ever becomes reachable for either architecture we ship.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! dependency_tree="$(cargo tree --locked --target "$target" --invert rkyv@0.7 2>&1)"; then
              echo "$dependency_tree" >&2
              exit 1
            fi
            if grep -q '^rkyv v' <<<"$dependency_tree"; then
              echo "RUSTSEC-2026-0235 is now reachable on $target" >&2
              exit 1
            fi
          done

          # RUSTSEC-2026-0367/0368/0369 affect zip extraction. zip is pulled in
          # only by tauri-plugin-updater on Windows (it installs .tar.gz on
          # macOS), so it is not built for either architecture we ship. Fail
          # before ignoring them if that ever changes.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! dependency_tree="$(cargo tree --locked --target "$target" --invert zip 2>&1)"; then
              echo "$dependency_tree" >&2
              exit 1
            fi
            if grep -q '^zip v' <<<"$dependency_tree"; then
              echo "zip advisories are now reachable on $target" >&2
              exit 1
            fi
          done

          cargo audit \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
