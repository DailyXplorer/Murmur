name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      # Rust tests and build.rs read these files.
      - "src/i18n/locales/**"
      - "src/bindings.ts"
      - "src/components/settings/history/HistorySettings.tsx"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      # Rust tests and build.rs read these files.
      - "src/i18n/locales/**"
      - "src/bindings.ts"
      - "src/components/settings/history/HistorySettings.tsx"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-tests:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      # The SwiftPM build of the meetings helper (build.rs, FluidAudio) is part
      # of this cache, as in build.yml, so only main saves it.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ hashFiles('src-tauri/swift/MurmurMeetingsHelper/Package.resolved') }}
          cache-directories: src-tauri/swift/MurmurMeetingsHelper/.build
          # Only main writes the cache: a pull request restores it and never
          # uploads its own ~1 GB copy (see BUILD.md, "Rust caches").
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      # One process per test, and a hung test fails after 2 minutes with its
      # name (.config/nextest.toml). nextest does not run doctests.
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo nextest run --locked --profile ci

      # The crate has no doctest, and this step is a second compile of the
      # crate (about a minute). A pull request skips it: `bun run check:doctests`
      # fails a pull request that adds a doctest, so none goes unrun.
      # A push to main and a manual run keep it.
      - name: Run Rust doctests
        if: github.event_name != 'pull_request'
        working-directory: src-tauri
        run: cargo test --locked --doc

      # After the tests, not before: `cargo nextest run` already built the
      # crate and the examples (cargo test builds examples), so these two reuse
      # that build. Run first they were a 200 s compile of the same crate.
      - name: Check generated macOS icons
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons -- --check

      - name: Test macOS icon generator
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Without models, analysis and the first load must report them missing
      # and never download: Murmur downloads them itself. The helper quits
      # when its stdin closes, as when Murmur quits, so stdin is held open.
      - name: Check the meetings helper stays offline
        working-directory: src-tauri
        shell: bash
        run: |
          helper=binaries/murmur-meetings-helper-aarch64-apple-darwin
          out=$("$helper" analyze --models-dir "$RUNNER_TEMP/no-models" --asr ultra < <(sleep 3600))
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          grep -q '"type":"done"' <<<"$out"
          if out=$("$helper" prepare --models-dir "$RUNNER_TEMP/no-models" --asr ultra < <(sleep 3600)); then
            echo "prepare succeeded without models" >&2
            exit 1
          fi
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          if out=$("$helper" serve --models-dir "$RUNNER_TEMP/no-models" --asr ultra < <(sleep 3600)); then
            echo "serve started without models" >&2
            exit 1
          fi
          echo "$out"
          grep -q '"code":"model_missing"' <<<"$out"
          test ! -e "$RUNNER_TEMP/no-models/parakeet-ultra"
          test ! -e "$RUNNER_TEMP/no-models/speaker-diarization"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail

          # RUSTSEC-2026-0235 affects rkyv 0.7, present only through
          # rust_decimal's inactive optional rkyv feature. ferrous-opencc uses
          # rkyv 0.8, which is patched from 0.8.17. Fail before ignoring it if
          # rkyv 0.7 ever becomes reachable for either architecture we ship.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! dependency_tree="$(cargo tree --locked --target "$target" --invert rkyv@0.7 2>&1)"; then
              echo "$dependency_tree" >&2
              exit 1
            fi
            if grep -q '^rkyv v' <<<"$dependency_tree"; then
              echo "RUSTSEC-2026-0235 is now reachable on $target" >&2
              exit 1
            fi
          done

          cargo audit --ignore RUSTSEC-2026-0235
