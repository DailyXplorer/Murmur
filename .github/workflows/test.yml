name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check generated macOS icons
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons -- --check

      - name: Test macOS icon generator
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
