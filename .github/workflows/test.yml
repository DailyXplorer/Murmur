name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check generated macOS icons
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons -- --check

      - name: Test macOS icon generator
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --example generate_macos_icons

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail

          # RUSTSEC-2026-0235 is present only through rust_decimal's inactive
          # optional rkyv feature. Fail before ignoring it if that ever changes
          # for either architecture we ship.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            if ! dependency_tree="$(cargo tree --locked --target "$target" --invert rkyv 2>&1)"; then
              echo "$dependency_tree" >&2
              exit 1
            fi
            if grep -q '^rkyv v' <<<"$dependency_tree"; then
              echo "RUSTSEC-2026-0235 is now reachable on $target" >&2
              exit 1
            fi
          done

          cargo audit --ignore RUSTSEC-2026-0235
