[package]
name = "murmur"
version = "1.8.0"
description = "Murmur"
authors = ["DailyXplorer"]
edition = "2021"
license = "MIT"
default-run = "murmur"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "murmur"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-notification = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
anyhow = "1.0.95"
base64 = "0.23"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "2.0.0"
tokio = { version = "1.43.0", features = ["sync", "time", "process", "rt", "macros", "io-util"] }
enigo = "0.6.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
rodio = "0.21.1"
reqwest = { version = "0.13", features = ["json", "query", "stream", "gzip", "brotli", "deflate", "multipart", "blocking"] }
rustfft = "6.4.0"
strsim = "0.11.0"
# Accent-insensitive word keys for meeting transcripts.
unicode-normalization = "0.1"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
ferrous-opencc = "0.4.0"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
image = { version = "0.25.9", default-features = false, features = ["png"] }
# Used by the guarded paste path for lazy NSPasteboard promises. Versions
# track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
# The copy notice's Escape monitor handler.
block2 = "0.6"
# Accessibility attribute values: window names, the correction watcher and
# the Insights browser-domain lookup.
core-foundation = "0.10"
# Free disk space before a meeting records (statvfs).
libc = "0.2"
# Checks each downloaded model file against the manifest.
sha2 = "0.10"

# Parakeet on the CPU of Intel Macs; Apple silicon runs it in the meetings
# helper. Pinned: the crate is young, and upgrades are deliberate.
[target.'cfg(target_arch = "x86_64")'.dependencies]
transcribe-cpp = { version = "=0.4.0", default-features = false }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
