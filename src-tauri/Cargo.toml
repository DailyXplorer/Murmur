[package]
name = "murmur"
version = "1.7.7"
description = "Murmur"
authors = ["DailyXplorer"]
edition = "2021"
license = "MIT"
default-run = "murmur"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "murmur"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-notification = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
anyhow = "1.0.95"
base64 = "0.22"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["sync", "time", "process", "rt", "macros", "io-util"] }
rodio = "0.21.1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "multipart", "blocking"] }
rustfft = "6.4.0"
strsim = "0.11.0"
# Accent-insensitive word keys for meeting transcripts.
unicode-normalization = "0.1"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
# Free disk space before a meeting records (statvfs).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The pointer location, for the overlay's screen.
enigo = "0.6.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
# Used by the guarded paste path for lazy NSPasteboard promises. Versions
# track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
# Accessibility attribute values: window names, the correction watcher and
# the Insights browser-domain lookup.
core-foundation = "0.10"
security-framework = "3.7.0"
# PNG encoding for the recolored Dock icon.
image = { version = "0.25.9", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The version Tauri already pulls in.
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Microphone privacy consent, kept by Windows in the registry.
winreg = "0.55"
# Only for the Debug page's connection test, which compares TLS stacks.
reqwest = { version = "0.12", features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
